<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ma journée</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ma journée">
<meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23223046'/%3E%3Ccircle cx='90' cy='76' r='33' fill='%234f7b5e'/%3E%3Crect x='48' y='126' width='84' height='11' rx='5.5' fill='%23de8747'/%3E%3C/svg%3E">
<style>
  :root{
    --fond:#fbfbf9; --carte:#ffffff; --champ:#ffffff;
    --texte:#223046; --gris:#8a8a82; --trait:#e7e6e0; --inerte:#ecebe5;
    --sauge:#4f7b5e; --abricot:#de8747; --barre:rgba(251,251,249,.92);
    --indigo:#5566b8; --azur:#2f8fb5; --prune:#96517a; --or:#c99a1f; --brique:#c0574a;
    --accent:var(--sauge);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --fond:#14181f; --carte:#1c222c; --champ:#232a35;
      --texte:#e9ebef; --gris:#9096a1; --trait:#2c3440; --inerte:#2c3440;
      --sauge:#6fa07e; --abricot:#e8a165; --barre:rgba(20,24,31,.92);
      --indigo:#8390de; --azur:#5cb3d6; --prune:#c07ba2; --or:#e0be5a; --brique:#e07f70;
    }
  }
  body[data-onglet=journee]  {--accent:var(--sauge)}
  body[data-onglet=routine]  {--accent:var(--brique)}
  body[data-onglet=habitudes]{--accent:var(--indigo)}
  body[data-onglet=suivi]    {--accent:var(--azur)}
  body[data-onglet=semaine]  {--accent:var(--abricot)}
  body[data-onglet=bilan]    {--accent:var(--prune)}

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--fond); color:var(--texte);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}

  header{position:sticky; top:0; z-index:5; background:var(--barre);
    backdrop-filter:blur(12px); padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    border-bottom:1px solid var(--trait)}
  header::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:linear-gradient(90deg, var(--sauge), var(--indigo), var(--azur), var(--abricot), var(--prune))}
  .jour{display:flex; align-items:center; gap:4px}
  .jour>button{background:none; border:0; font-size:24px; color:var(--texte); padding:4px 10px; cursor:pointer}
  .centre{flex:1; text-align:center; min-width:0}
  .centre h1{margin:0; font-size:17px; font-weight:600; letter-spacing:-.2px}
  .retour{font-size:12px; color:var(--sauge); background:none; border:0; padding:2px; cursor:pointer}
  .reglages{background:none; border:0; font-size:19px; color:var(--gris); padding:4px 8px; cursor:pointer}

  main{padding:14px}
  .carte{background:var(--carte); border:1px solid var(--trait); border-radius:18px; padding:16px; margin-bottom:13px}
  .carte{position:relative}
  .carte h2{margin:0 0 12px; font-size:13px; font-weight:600; color:var(--accent);
    display:flex; align-items:center; gap:7px}
  .carte h2::before{content:''; width:7px; height:7px; border-radius:50%;
    background:var(--accent); flex:0 0 7px}
  .gros{font-size:22px; font-weight:600; letter-spacing:-.4px}
  .vide{color:var(--gris); font-size:14px; line-height:1.5; margin:0 0 12px}
  .entre{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .rangee{display:flex; align-items:center; gap:8px; flex-wrap:wrap}

  .barre-p{height:8px; border-radius:99px; background:var(--inerte); overflow:hidden; margin-top:12px}
  .barre-p span{display:block; height:100%; background:var(--accent); transition:width .3s}

  .tache{display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-top:1px solid var(--trait)}
  .tache:first-of-type{border-top:0}
  .coche{width:26px; height:26px; flex:0 0 26px; margin-top:1px; border-radius:50%;
    border:2px solid var(--gris); background:none; color:#fff; font-size:14px; padding:0; cursor:pointer}
  .coche.on{background:var(--accent); border-color:var(--accent)}
  .tache .txt{flex:1; font-size:16px; line-height:1.35; text-align:left; background:none;
    border:0; color:var(--texte); padding:0; font-family:inherit; cursor:pointer}
  .tache.done .txt{text-decoration:line-through; color:var(--gris)}
  .meta{font-size:12px; color:var(--abricot); margin-top:3px; display:flex; gap:8px; align-items:center}
  .meta .rep{color:var(--gris)}

  .semaine{display:flex; gap:5px; margin-bottom:12px}
  .semaine>div{flex:1; text-align:center}
  .semaine small{display:block; font-size:10px; color:var(--gris); margin-bottom:5px}
  .pastille{width:22px; height:22px; border-radius:50%; background:var(--inerte); margin:0 auto}
  .pastille.on{background:var(--accent)}
  .pastille.actuel{box-shadow:0 0 0 2px var(--fond), 0 0 0 4px var(--abricot)}
  .serie{font-size:12px; color:var(--abricot)}
  .pion{width:34px; height:34px; border-radius:50%; border:1px solid var(--trait);
    background:var(--champ); color:var(--gris); font-size:13px; font-weight:600;
    font-family:inherit; cursor:pointer; padding:0}
  .pion.on{background:var(--accent); border-color:var(--accent); color:#fff}
  button.act:disabled{opacity:.4}
  .fleche{background:none; border:0; color:var(--gris); font-size:11px; line-height:1.1;
    padding:1px 4px; cursor:pointer}
  .fleche:disabled{opacity:.25}
  .etiq{font-size:11px; padding:3px 9px; border-radius:99px;
    background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent)}

  button.act{border:0; border-radius:12px; padding:10px 15px; font-size:14px; font-weight:500;
    background:var(--texte); color:var(--fond); cursor:pointer; font-family:inherit}
  button.act.on{background:var(--accent); color:#fff}
  button.mini{border:1px solid var(--trait); background:var(--champ); border-radius:11px;
    padding:9px 13px; font-size:14px; color:var(--texte); cursor:pointer; font-family:inherit}
  button.mini.on{border-color:var(--accent); color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent)}
  .suppr{background:none; border:0; color:var(--gris); font-size:20px; padding:2px 4px; cursor:pointer}

  .humeurs{display:flex}
  .humeurs button{flex:1; background:none; border:0; font-size:29px; padding:6px 0; cursor:pointer; opacity:.32; border-radius:14px}
  .humeurs.vierge button{opacity:1}
  .humeurs button.on{opacity:1; background:var(--inerte)}

  input[type=range]{width:100%; accent-color:var(--accent)}
  .compteur{display:flex; align-items:center; gap:16px}
  .compteur button{width:38px; height:38px; border-radius:50%; border:1px solid var(--trait);
    background:var(--champ); font-size:20px; color:var(--texte); cursor:pointer}
  .etoiles{display:flex}
  .etoiles button{flex:1; background:none; border:0; font-size:26px; padding:4px 0; cursor:pointer; color:var(--inerte)}
  .etoiles button.on{color:var(--or)}

  .ligne{display:flex; justify-content:space-between; font-size:15px; padding:6px 0}
  .ligne span:first-child{color:var(--gris)}

  textarea,input[type=text],input[type=time],input[type=date],select{width:100%; font-family:inherit;
    font-size:16px; color:var(--texte); border:1px solid var(--trait); border-radius:12px;
    padding:11px; background:var(--champ); resize:none; -webkit-appearance:none}
  textarea{min-height:112px; line-height:1.45}
  label.champ{display:block; font-size:13px; color:var(--gris); margin:14px 0 6px}

  .histo{display:flex; align-items:flex-end; gap:6px; height:96px; margin-bottom:8px}
  .histo>div{flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%}
  .histo .col{background:var(--accent); border-radius:6px 6px 0 0; min-height:3px}
  .histo .col.creux{background:var(--inerte)}
  .jours{display:flex; gap:6px}
  .jours>div{flex:1; text-align:center; font-size:10px; color:var(--gris)}

  nav{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--barre);
    backdrop-filter:blur(12px); border-top:1px solid var(--trait);
    padding-bottom:env(safe-area-inset-bottom); z-index:6}
  nav button{flex:1; background:none; border:0; padding:9px 1px 7px; color:var(--gris);
    font-size:9.5px; font-family:inherit; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; gap:3px}
  nav button svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round}
  nav button.on{color:var(--accent)}
  nav button[data-onglet=journee].on  {color:var(--sauge)}
  nav button[data-onglet=routine].on  {color:var(--brique)}
  nav button[data-onglet=habitudes].on{color:var(--indigo)}
  nav button[data-onglet=suivi].on    {color:var(--azur)}
  nav button[data-onglet=semaine].on  {color:var(--abricot)}
  nav button[data-onglet=bilan].on    {color:var(--prune)}

  .fond{position:fixed; inset:0; background:rgba(10,14,20,.45); opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:10}
  .fond.on{opacity:1; pointer-events:auto}
  .feuille{position:fixed; left:0; right:0; bottom:0; background:var(--fond); z-index:11;
    border-radius:22px 22px 0 0; border-top:1px solid var(--trait);
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .25s ease; max-height:88vh; overflow-y:auto}
  .feuille.on{transform:translateY(0)}
  .feuille h3{margin:2px 0 14px; font-size:17px}
  .emojis{display:flex; gap:6px; overflow-x:auto; padding:4px 0}
  .emojis button{font-size:25px; background:none; border:0; padding:6px; border-radius:50%; cursor:pointer}
  .emojis button.on{background:var(--inerte)}

  .alerte{background:var(--abricot); color:#231607; border-radius:14px; padding:12px 14px;
    font-size:13px; line-height:1.45; margin-bottom:13px}
  .alerte button{background:#231607; color:#fff; border:0; border-radius:9px;
    padding:7px 12px; font-size:13px; margin-top:9px; cursor:pointer; font-family:inherit}
</style>
</head>
<body>

<header>
  <div class="jour">
    <button onclick="bouger(-1)" aria-label="Jour précédent">‹</button>
    <div class="centre">
      <h1 id="titreJour"></h1>
      <button class="retour" id="retourJour" onclick="aujourdhui()" hidden>Revenir à aujourd'hui</button>
    </div>
    <button onclick="bouger(1)" aria-label="Jour suivant">›</button>
    <button class="reglages" onclick="feuilleReglages()" aria-label="Réglages">⚙</button>
  </div>
</header>

<main id="ecran"></main>

<nav>
  <button data-onglet="journee" onclick="ouvrir('journee')">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Journée</button>
  <button data-onglet="routine" onclick="ouvrir('routine')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Routine</button>
  <button data-onglet="habitudes" onclick="ouvrir('habitudes')">
    <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>Habitudes</button>
  <button data-onglet="suivi" onclick="ouvrir('suivi')">
    <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 10-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 000-7.8z"/></svg>Suivi</button>
  <button data-onglet="semaine" onclick="ouvrir('semaine')">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Semaine</button>
  <button data-onglet="bilan" onclick="ouvrir('bilan')">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>Bilan</button>
</nav>

<div class="fond" id="fond" onclick="fermerFeuille()"></div>
<div class="feuille" id="feuille"></div>
<input type="file" id="fichierImport" accept=".json,application/json" hidden onchange="importer(this)">
<input type="file" id="fichierStrava" accept=".csv,text/csv" hidden onchange="importerStrava(this)">

<script>
"use strict";

/* ================= Sauvegarde ================= */
const CLE = 'majournee';
let secours = null;              // si Safari bloque le stockage
let minuteurSauvegarde = null;

function neuf(){
  const rMatin = cleUnique();
  return {version:3, taches:[], modeles:[], logs:{},
  routines:[{id:rMatin, nom:"Matin", emoji:"🌅", jours:[], etapes:[
    {id:cleUnique(), titre:"Boire un grand verre d'eau", heure:"07:30"},
    {id:cleUnique(), titre:"Étirements", heure:"07:45"},
    {id:cleUnique(), titre:"Écrire les 3 priorités du jour", heure:"08:00"}
  ]}],
  habitudes:[
    {id:cleUnique(), nom:"Bouger 20 minutes", emoji:"🏃", jours:[]},
    {id:cleUnique(), nom:"Lire", emoji:"📖", jours:[]},
    {id:cleUnique(), nom:"Pas d'écran après 22h", emoji:"🌙", jours:[]}
  ], vu:{}};
}
function cleUnique(){ return Math.random().toString(36).slice(2,10); }

function charger(){
  let brut = null;
  try{ brut = localStorage.getItem(CLE) || localStorage.getItem('majournee-v1'); }catch(e){}
  if(!brut) return neuf();
  let d;
  try{ d = JSON.parse(brut); }catch(e){ return neuf(); }
  d.version  = 3;
  d.routines  = d.routines  || [];
  d.enCours   = d.enCours   || null;
  d.taches    = d.taches    || [];
  d.modeles   = d.modeles   || [];
  d.habitudes = d.habitudes || [];
  d.logs      = d.logs      || {};
  d.vu        = d.vu        || {};
  return d;
}
/** Écrit au plus une fois toutes les 400 ms. */
function sauver(){
  secours = data;
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = setTimeout(ecrire, 400);
}
function ecrire(){
  const texte = JSON.stringify(data);
  try{ localStorage.setItem(CLE, texte); }
  catch(e){ console.warn('Stockage indisponible', e); }
  copieDeSecours(texte);
}
/** Une seconde copie, écrite une fois par semaine, à part des données courantes. */
function copieDeSecours(texte){
  try{
    const marque = localStorage.getItem(CLE+'-secours-date');
    const aujourd = cle(new Date());
    if(marque && (new Date(aujourd) - new Date(marque)) / 86400000 < 7) return;
    localStorage.setItem(CLE+'-secours', texte);
    localStorage.setItem(CLE+'-secours-date', aujourd);
  }catch(e){}
}
function dateSecours(){
  try{ return localStorage.getItem(CLE+'-secours-date'); }catch(e){ return null; }
}
function restaurerSecours(){
  let brut = null;
  try{ brut = localStorage.getItem(CLE+'-secours'); }catch(e){}
  if(!brut){ alert("Aucune copie de secours disponible."); return; }
  if(!confirm("Revenir à la copie du "+dateSecours()+" ? Les données actuelles seront remplacées.")) return;
  try{ data = JSON.parse(brut); }catch(e){ alert("Copie illisible."); return; }
  sauver(); ecrire(); fermerFeuille(); rendre();
  alert("Copie de secours restaurée.");
}
window.addEventListener('pagehide', ecrire);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) ecrire(); });
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ================= Dates ================= */
function cle(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function libelle(d){
  const t = d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function decale(d,n){ const c=new Date(d); c.setDate(c.getDate()+n); return c; }
function estAujourdhui(d){ return cle(d)===cle(new Date()); }
/** La semaine calendaire contenant d : toujours du lundi au dimanche. */
function sept(d){
  const lundi = new Date(d);
  const js = lundi.getDay();                    // 0 = dimanche
  lundi.setDate(lundi.getDate() - (js===0 ? 6 : js-1));
  return [...Array(7)].map((_,i)=>decale(lundi,i));
}
function libelleSemaine(d){
  const s = sept(d), a = s[0], b = s[6];
  const opt = {day:'numeric', month:'long'};
  return 'Du '+a.toLocaleDateString('fr-FR',opt)+' au '+b.toLocaleDateString('fr-FR',opt);
}
function initiale(d){ return d.toLocaleDateString('fr-FR',{weekday:'narrow'}).toUpperCase(); }

/* ================= État ================= */
let data = charger();
let jour = new Date();
let onglet = 'journee';
const K = ()=>cle(jour);

function log(k){
  if(!data.logs[k]) data.logs[k] = {humeur:null, sommeil:7, eau:0, sport:0, note:'', bonne:'', note5:null};
  return data.logs[k];
}
/** Rang de tri : l'heure d'abord, puis l'ordre choisi à la main. */
function rang(t){
  if(t.ordre !== undefined) return t.ordre;
  return (t.heure ? +t.heure.slice(0,2)*60 + +t.heure.slice(3) : 9999) * 100;
}
function taches(k){
  return data.taches.filter(t=>t.jour===k).sort((a,b)=>rang(a)-rang(b));
}
function normaliserOrdre(k){
  taches(k).forEach((t,i)=>{ t.ordre = i*100; });
}
function deplacerTache(i, sens){
  const t = data.taches.find(x=>x.id===i), k = t.jour;
  normaliserOrdre(k);
  const liste = taches(k), pos = liste.findIndex(x=>x.id===i), cible = pos + sens;
  if(cible < 0 || cible >= liste.length) return;
  const provisoire = liste[pos].ordre;
  liste[pos].ordre = liste[cible].ordre;
  liste[cible].ordre = provisoire;
  sauver(); rendre();
}
function reporterDemain(i){
  const t = data.taches.find(x=>x.id===i);
  t.jour = cle(decale(new Date(t.jour+'T12:00:00'), 1));
  t.fait = false; t.ordre = undefined;
  sauver(); fermerFeuille(); rendre();
}
function dupliquerTache(i){
  const t = data.taches.find(x=>x.id===i);
  data.taches.push({id:cleUnique(), titre:t.titre, jour:t.jour, heure:t.heure,
                    duree:t.duree, type:t.type, fait:false});
  sauver(); fermerFeuille(); rendre();
}
function serie(h){
  let n=0, c=new Date(jour);
  while(h.jours.includes(cle(c))){ n++; c=decale(c,-1); }
  return n;
}

/* ---- Tâches récurrentes : on crée l'exemplaire du jour à l'ouverture ---- */
function appliquerModeles(k){
  const d = new Date(k+'T12:00:00'), js = d.getDay();
  let ajout = false;
  data.modeles.forEach(m=>{
    if(m.debut && k < m.debut) return;
    const concerne = m.repetition==='quotidien'
      || (m.repetition==='ouvres' && js>=1 && js<=5)
      || (m.repetition==='hebdo' && js===m.jourSemaine);
    if(!concerne) return;
    if(data.taches.some(t=>t.modele===m.id && t.jour===k)) return;
    data.taches.push({id:cleUnique(), titre:m.titre, jour:k, heure:m.heure, fait:false, modele:m.id});
    ajout = true;
  });
  if(ajout) sauver();
}

/* ---- Routines toutes prêtes ---- */
let BIBLIO = [], JOURNEES = [], HABITUDES = [];
let catalogueCharge = false, chargementCatalogue = null;

/** Le catalogue arrive seulement quand on en a besoin. */
function chargerCatalogue(){
  if(catalogueCharge) return Promise.resolve(true);
  if(chargementCatalogue) return chargementCatalogue;
  chargementCatalogue = new Promise(resoudre=>{
    const balise = document.createElement('script');
    balise.src = 'catalogue.js';
    balise.onload = () => {
      BIBLIO    = window.CATALOGUE.BIBLIO;
      JOURNEES  = window.CATALOGUE.JOURNEES;
      HABITUDES = window.CATALOGUE.HABITUDES;
      JOURNEES.forEach(j=>BIBLIO.push({cat:"Journée type", nom:j.nom, emoji:j.emoji,
                                       depart:j.depart, etapes:j.etapes}));
      catalogueCharge = true;
      resoudre(true);
    };
    balise.onerror = () => { alert("Catalogue introuvable. Vérifie que catalogue.js est en ligne à côté de index.html."); resoudre(false); };
    document.head.appendChild(balise);
  });
  return chargementCatalogue;
}

/* ---- Journées types : un modèle qui remplit toute la journée ---- */


/** Recalcule les heures à partir de l'heure de départ et des durées. */
function recalculerHeures(r){
  if(!r.depart) return;
  let [h,m] = r.depart.split(':').map(Number);
  r.etapes.forEach(e=>{
    e.heure = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    m += (e.duree || 10);
    h = (h + Math.floor(m/60)) % 24;
    m = m % 60;
  });
}
function finRoutine(r){
  const total = r.etapes.reduce((a,e)=>a+(e.duree||10),0);
  if(!r.depart) return total+' min au total';
  let [h,m] = r.depart.split(':').map(Number);
  m += total; h = (h + Math.floor(m/60)) % 24; m = m % 60;
  return 'de '+r.depart.replace(':','h')+' à '+String(h).padStart(2,'0')+'h'+String(m).padStart(2,'0');
}
function deplacerEtape(idR, idE, sens){
  const r = data.routines.find(x=>x.id===idR);
  const i = r.etapes.findIndex(e=>e.id===idE), j = i + sens;
  if(j<0 || j>=r.etapes.length) return;
  [r.etapes[i], r.etapes[j]] = [r.etapes[j], r.etapes[i]];
  recalculerHeures(r); sauver(); rendre();
}

/* ================= Report automatique dans le suivi ================= */
const MOTS = {
  sport: /(sport|course|courir|marche|marcher|randonn|v[ée]lo|nage|natation|entra[îi]nement|match|tournoi|renforcement|gainage|circuit|mobilit[ée]|[ée]tirement|yoga|escalade|foot|futsal|basket|handball|volley|rugby|padel|tennis|danse|s[ée]ance|[ée]chauffement|poules|phase finale)/i,
  eau:   /(verre d'eau|boire|hydrat)/i
};
function typeEtape(titre){
  if(MOTS.sport.test(titre)) return 'sport';
  if(MOTS.eau.test(titre))   return 'eau';
  return null;
}
/** Cocher une étape de routine remplit le suivi tout seul. */
function reporterSuivi(t, sens){
  const type = t.type || ((t.routine || t.duree) ? typeEtape(t.titre) : null);
  if(!type || type === 'aucun') return;
  const l = log(t.jour);
  if(type === 'sport'){
    const minutes = t.duree || 0;
    l.sport     = Math.max(0, (l.sport||0)     + sens*minutes);
    l.autoSport = Math.max(0, (l.autoSport||0) + sens*minutes);
  }
  if(type === 'eau'){
    l.eau     = Math.max(0, (l.eau||0)     + sens);
    l.autoEau = Math.max(0, (l.autoEau||0) + sens);
  }
}

/** Toute la routine part dans le calendrier de l'iPhone, un événement par étape. */
function routineCalendrier(idRoutine){
  const r = data.routines.find(x=>x.id===idRoutine), k = K();
  const lignes = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ma journee//FR'];
  r.etapes.forEach(e=>{
    if(!e.heure) return;
    const [h,m] = e.heure.split(':').map(Number);
    const duree = e.duree || 10;
    let fh = h, fm = m + duree; fh = (fh + Math.floor(fm/60)) % 24; fm = fm % 60;
    const j = k.replace(/-/g,'');
    lignes.push('BEGIN:VEVENT','UID:'+e.id+'@majournee',
      'DTSTAMP:'+j+'T'+String(h).padStart(2,'0')+String(m).padStart(2,'0')+'00',
      'DTSTART:'+j+'T'+String(h).padStart(2,'0')+String(m).padStart(2,'0')+'00',
      'DTEND:'+j+'T'+String(fh).padStart(2,'0')+String(fm).padStart(2,'0')+'00',
      'SUMMARY:'+(r.emoji+' '+e.titre).replace(/[,;\\]/g,' '),
      'BEGIN:VALARM','TRIGGER:-PT5M','ACTION:DISPLAY','DESCRIPTION:'+e.titre.replace(/[,;\\]/g,' '),
      'END:VALARM','END:VEVENT');
  });
  lignes.push('END:VCALENDAR');
  if(lignes.length<=4){ alert("Donne d'abord une heure de départ à la routine."); return; }
  telecharger(new Blob([lignes.join('\r\n')],{type:'text/calendar'}), 'routine.ics');
}

/* ================= Export / import ================= */
function telecharger(blob, nom){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function exporter(){
  const contenu = JSON.stringify(data);
  const nom = 'majournee-'+cle(new Date())+'.json';
  const fichier = new File([contenu], nom, {type:'application/json'});
  data.vu.export = cle(new Date());
  sauver(); ecrire();
  if(navigator.canShare && navigator.canShare({files:[fichier]})){
    navigator.share({files:[fichier], title:'Sauvegarde Ma journée'}).catch(()=>{});
  }else{
    telecharger(new Blob([contenu],{type:'application/json'}), nom);
  }
  rendre();
}

function lireParametres(){
  const p = new URLSearchParams(location.search);
  if(![...p.keys()].length) return;
  const k = p.get('date') || cle(new Date());
  const l = log(k);
  let recu = [];
  if(p.get('pas')){     l.pas     = Math.round(+p.get('pas'));           recu.push('pas'); }
  if(p.get('sommeil')){ l.sommeil = Math.min(14, +p.get('sommeil'));     recu.push('sommeil'); }
  if(p.get('sport')){   l.sport   = Math.round(+p.get('sport'));         recu.push('activité'); }
  if(p.get('eau')){     l.eau     = Math.round(+p.get('eau'));           recu.push('eau'); }
  if(recu.length){
    data.vu.sante = cle(new Date());
    sauver(); ecrire();
    setTimeout(()=>alert("Données reçues de l'app Santé : "+recu.join(', ')+"."), 400);
  }
  history.replaceState({}, '', location.pathname);   // on nettoie l'adresse
}

/* ---- Strava : import du fichier d'activités ---- */
function decouperCSV(ligne){
  const cases = []; let courant = '', dansGuillemets = false;
  for(const c of ligne){
    if(c === '"') dansGuillemets = !dansGuillemets;
    else if(c === ',' && !dansGuillemets){ cases.push(courant); courant = ''; }
    else courant += c;
  }
  cases.push(courant);
  return cases;
}
function importerStrava(input){
  const f = input.files[0];
  if(!f) return;
  const lecteur = new FileReader();
  lecteur.onload = () => {
    const lignes = String(lecteur.result).split(/\r?\n/).filter(l=>l.trim());
    if(lignes.length < 2){ alert("Fichier vide."); input.value=''; return; }
    const entetes = decouperCSV(lignes[0]).map(h=>h.trim().toLowerCase());
    const iDate = entetes.findIndex(h=>h.includes('date'));
    const iDuree = entetes.findIndex(h=>h.includes('moving time') || h.includes('temps de déplacement')
                              || h.includes('elapsed time') || h.includes('durée'));
    if(iDate < 0 || iDuree < 0){
      alert("Colonnes introuvables. Utilise le fichier activities.csv de l'export Strava.");
      input.value=''; return;
    }
    const parJour = {};
    lignes.slice(1).forEach(ligne=>{
      const c = decouperCSV(ligne);
      const d = new Date(c[iDate]);
      if(isNaN(d)) return;
      let v = parseFloat(String(c[iDuree]).replace(',','.'));
      if(isNaN(v)) return;
      const minutes = v > 600 ? Math.round(v/60) : Math.round(v);   // secondes ou minutes
      const k = cle(d);
      parJour[k] = (parJour[k] || 0) + minutes;
    });
    const jours = Object.keys(parJour);
    if(!jours.length){ alert("Aucune activité lisible dans ce fichier."); input.value=''; return; }
    if(!confirm(jours.length+" jours d'activité trouvés. Les ajouter au suivi ?")){ input.value=''; return; }
    jours.forEach(k=>{
      const l = log(k);
      l.sport = Math.max(l.sport||0, parJour[k]);   // on ne double pas ce qui est déjà noté
    });
    sauver(); ecrire(); fermerFeuille(); rendre();
    alert("Activités importées sur "+jours.length+" jours.");
  };
  lecteur.readAsText(f);
  input.value = '';
}

let vueStats = 'semaine';
function changerVue(v){ vueStats = v; rendre(); }

function ecranMois(){
  const debut = new Date(jour.getFullYear(), jour.getMonth(), 1);
  const nbJours = new Date(jour.getFullYear(), jour.getMonth()+1, 0).getDate();
  const decalage = (debut.getDay() + 6) % 7;                  // lundi en première colonne
  const cases = [...Array(decalage).fill(null),
                 ...[...Array(nbJours)].map((_,i)=>new Date(jour.getFullYear(), jour.getMonth(), i+1))];
  const visages = {1:'😔',2:'😕',3:'😐',4:'🙂',5:'😄'};
  const logsMois = cases.filter(Boolean).map(d=>data.logs[cle(d)]).filter(Boolean);
  const moyenne = f => {
    const v = logsMois.map(f).filter(x=>x!==null && x!==undefined);
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0;
  };
  const nomMois = jour.toLocaleDateString('fr-FR',{month:'long', year:'numeric'});
  return basculeVue() + `
  <div class="carte" style="--accent:var(--abricot)"><h2>${nomMois.charAt(0).toUpperCase()+nomMois.slice(1)}</h2>
    <div class="jours" style="margin-bottom:6px">${['L','M','M','J','V','S','D'].map(l=>`<div>${l}</div>`).join('')}</div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px">
      ${cases.map(d=>{
        if(!d) return '<div></div>';
        const k = cle(d), liste = data.taches.filter(t=>t.jour===k);
        const pct = liste.length ? liste.filter(t=>t.fait).length/liste.length : null;
        const fond = pct===null ? 'var(--inerte)' : `color-mix(in srgb, var(--sauge) ${Math.round(pct*100)}%, var(--inerte))`;
        return `<button onclick="allerA('${k}')" style="aspect-ratio:1; border:0; padding:0; border-radius:9px;
          background:${fond}; color:${pct>0.5?'#fff':'var(--gris)'}; font-size:11px; font-family:inherit;
          ${k===K()?'outline:2px solid var(--abricot); outline-offset:1px':''}">${d.getDate()}</button>`;
      }).join('')}
    </div>
    <p class="vide" style="margin:12px 0 0">Plus la case est verte, plus la journée a été menée à bout.
    Appuie sur un jour pour l'ouvrir.</p>
  </div>
  <div class="carte" style="--accent:var(--prune)"><h2>Humeur du mois</h2>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px; font-size:17px; text-align:center">
      ${cases.map(d=>{
        if(!d) return '<div></div>';
        const l = data.logs[cle(d)];
        return `<div>${l && l.humeur ? visages[l.humeur] : '·'}</div>`;
      }).join('')}
    </div>
  </div>
  <div class="carte"><h2>Moyennes du mois</h2>
    <div class="ligne"><span>Jours remplis</span><span>${logsMois.length} sur ${nbJours}</span></div>
    <div class="ligne"><span>Sommeil</span><span>${fmt(moyenne(l=>l.sommeil))} h par nuit</span></div>
    <div class="ligne"><span>Eau</span><span>${Math.round(moyenne(l=>l.eau)*10)/10} verres par jour</span></div>
    <div class="ligne"><span>Activité</span><span>${logsMois.reduce((a,l)=>a+(l.sport||0),0)} min au total</span></div>
    <div class="ligne"><span>Humeur</span><span>${logsMois.filter(l=>l.humeur).length ? fmt(moyenne(l=>l.humeur))+' sur 5' : '—'}</span></div>
  </div>`;
}
function allerA(k){
  jour = new Date(k+'T12:00:00'); onglet = 'journee'; window.scrollTo(0,0); rendre();
}
function basculeVue(){
  return `<div class="rangee" style="margin-bottom:13px">
    ${[['semaine','Semaine'],['mois','Mois']].map(([v,l])=>
      `<button class="mini ${vueStats===v?'on':''}" style="flex:1" onclick="changerVue('${v}')">${l}</button>`).join('')}
  </div>`;
}

function ecranSemaine(){
  if(vueStats === 'mois') return ecranMois();
  const semaine = sept(jour);
  const stats = semaine.map(d=>{
    const k = cle(d), t = data.taches.filter(x=>x.jour===k);
    return {k, d,
      pct: t.length ? t.filter(x=>x.fait).length/t.length : 0,
      total: t.length,
      l: data.logs[k] || null,
      hab: data.habitudes.filter(h=>h.jours.includes(k)).length};
  });
  const moy = (f,def) => {
    const v = stats.map(f).filter(x=>x!==null && x!==undefined);
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : def;
  };
  const visages = {1:'😔',2:'😕',3:'😐',4:'🙂',5:'😄'};
  return basculeVue() + `
  <div class="carte"><h2>${libelleSemaine(jour)}</h2>
    <div style="margin:-4px 0 12px; font-size:13px; color:var(--gris)">Tâches terminées</div>
    <div class="histo">${stats.map((s,i)=>`<div>
      <div class="col ${s.total?'':'creux'}" style="height:${s.total? Math.max(4, s.pct*100) : 4}%;
        ${s.total?'background:'+teinte(i)+';':''}"></div>
    </div>`).join('')}</div>
    <div class="jours">${stats.map(s=>`<div${cle(s.d)===K()?' style="color:var(--sauge); font-weight:700"':''}>${initiale(s.d)}</div>`).join('')}</div>
  </div>
  <div class="carte"><h2>Humeur</h2>
    <div class="jours" style="font-size:22px; margin-bottom:6px">
      ${stats.map(s=>`<div>${s.l && s.l.humeur ? visages[s.l.humeur] : '·'}</div>`).join('')}</div>
    <div class="jours">${stats.map(s=>`<div>${initiale(s.d)}</div>`).join('')}</div>
  </div>
  ${data.routines.length ? `<div class="carte" style="--accent:var(--brique)"><h2>Routines de la semaine</h2>
    ${data.routines.map(r=>{
      const liees = stats.flatMap(x=>data.taches.filter(t=>t.jour===x.k && t.routine===r.id));
      if(!liees.length) return '';
      const faites = liees.filter(t=>t.fait).length;
      const pct = Math.round(faites/liees.length*100);
      return `<div style="margin-bottom:12px">
        <div class="entre" style="font-size:14px">
          <span>${r.emoji} ${prot(r.nom)}</span><span class="serie">${faites}/${liees.length} · ${pct}%</span>
        </div>
        <div class="barre-p"><span style="width:${pct}%"></span></div>
      </div>`;
    }).join('') || '<p class="vide">Aucune routine appliquée cette semaine.</p>'}
    <div class="ligne" style="border-top:1px solid var(--trait); padding-top:10px">
      <span>Minutes venues des routines</span>
      <span>${stats.reduce((a,s)=>a+(s.l&&s.l.autoSport?s.l.autoSport:0),0)} min</span></div>
  </div>` : ''}
  <div class="carte"><h2>Moyennes de la semaine</h2>
    <div class="ligne"><span>Sommeil</span><span>${fmt(moy(s=>s.l?s.l.sommeil:null,0))} h par nuit</span></div>
    <div class="ligne"><span>Eau</span><span>${Math.round(moy(s=>s.l?s.l.eau:null,0)*10)/10} verres par jour</span></div>
    <div class="ligne"><span>Activité</span><span>${stats.reduce((a,s)=>a+(s.l?s.l.sport:0),0)} min au total</span></div>
    <div class="ligne"><span>Habitudes tenues</span><span>${stats.reduce((a,s)=>a+s.hab,0)} sur ${data.habitudes.length*7}</span></div>
    ${stats.some(s=>s.l&&s.l.pas) ? `<div class="ligne"><span>Pas</span><span>${stats.reduce((a,s)=>a+(s.l&&s.l.pas?s.l.pas:0),0).toLocaleString('fr-FR')} au total</span></div>` : ''}
  </div>`;
}

  if(n !== null && n < 14) return '';

    <br><button onclick="exporter()">Enregistrer une copie</button></div>`;

/* ---- Mode enchaînement : on déroule la routine étape par étape ---- */
let chrono = null, resteSecondes = 0;

function lancerRoutine(idRoutine){
  data.enCours = {routine:idRoutine, index:0, debut:Date.now()};
  sauver(); afficherEtape(); montrerFeuille();
}
function reprendreRoutine(){
  if(!data.enCours) return;
  afficherEtape(); montrerFeuille();
}
function arreterRoutine(){
  data.enCours = null; sauver(); clearInterval(chrono); fermerFeuille(); rendre();
}
/** Bandeau de reprise si une routine a été laissée en plan. */
function banniereRoutine(){
  const c = data.enCours;
  if(!c) return '';
  const r = data.routines.find(x=>x.id===c.routine);
  if(!r || c.index >= r.etapes.length){ data.enCours = null; return ''; }
  return `<div class="alerte">
    ${r.emoji} ${prot(r.nom)} en cours — étape ${c.index+1} sur ${r.etapes.length} :
    ${prot(r.etapes[c.index].titre)}
    <br><button onclick="reprendreRoutine()">Reprendre</button>
    <button onclick="arreterRoutine()" style="margin-left:8px; background:none; color:#231607; border:1px solid #231607">Arrêter</button>
  </div>`;
}
function afficherEtape(){
  const c = data.enCours;
  if(!c) return;
  const r = data.routines.find(x=>x.id===c.routine);
  clearInterval(chrono);
  if(!r || c.index >= r.etapes.length){
    document.getElementById('feuille').innerHTML = `
      <h3>${r ? r.emoji+' '+prot(r.nom) : 'Routine'}</h3>
      <div class="carte" style="--accent:var(--sauge); text-align:center">
        <div class="gros" style="margin:14px 0">Routine terminée</div>
        <p class="vide">${r ? r.etapes.length : 0} étapes enchaînées.</p>
      </div>
      <button class="act" style="width:100%" onclick="arreterRoutine()">Fermer</button>`;
    return;
  }
  const e = r.etapes[c.index];
  const total = (e.duree || 10) * 60;
  resteSecondes = Math.max(0, total - Math.floor((Date.now() - c.debut)/1000));
  document.getElementById('feuille').innerHTML = `
    <h3>${r.emoji} ${prot(r.nom)}</h3>
    <p class="vide" style="margin-top:-8px">Étape ${c.index+1} sur ${r.etapes.length}</p>
    <div class="carte" style="--accent:var(--brique); text-align:center">
      <div class="gros" style="font-size:26px; margin:6px 0 14px">${prot(e.titre)}</div>
      <div id="chrono" style="font-size:44px; font-weight:600; letter-spacing:-1px">${mmss(resteSecondes)}</div>
      <div class="barre-p"><span id="jauge" style="width:${Math.min(100,(1-resteSecondes/total)*100)}%"></span></div>
    </div>
    <div class="rangee">
      <button class="act on" style="flex:1" onclick="etapeSuivante()">Étape suivante</button>
      <button class="mini" onclick="fermerFeuille()">Plus tard</button>
      <button class="mini" onclick="arreterRoutine()">Arrêter</button>
    </div>
    ${r.etapes.map((x,i)=>`<div class="ligne" style="opacity:${i<c.index?.4:1}">
      <span>${i<c.index?'✓':(i===c.index?'▶':'·')} ${prot(x.titre)}</span>
      <span>${x.duree||10} min</span></div>`).join('')}`;
  chrono = setInterval(()=>{
    resteSecondes--;
    const ch = document.getElementById('chrono'), j = document.getElementById('jauge');
    if(!ch){ clearInterval(chrono); return; }
    ch.textContent = mmss(Math.max(0,resteSecondes));
    if(j) j.style.width = Math.min(100, (1 - resteSecondes/total)*100)+'%';
    if(resteSecondes <= 0){
      clearInterval(chrono);
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      ch.style.color = 'var(--sauge)';
    }
  }, 1000);
}
function mmss(s){
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function etapeSuivante(){
  const c = data.enCours;
  const r = data.routines.find(x=>x.id===c.routine);
  const e = r.etapes[c.index], k = K();
  const t = data.taches.find(x=>x.etape===e.id && x.jour===k);
  if(t && !t.fait){ t.fait = true; reporterSuivi(t, 1); }
  c.index++; c.debut = Date.now();
  sauver(); afficherEtape();
}

let repChoisie = 'non', typeChoisi = 'aucun';
function choisirType(el){
  typeChoisi = el.dataset.type;
  [...el.parentNode.children].forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
function choisirRep(el){
  repChoisie = el.dataset.rep;
  [...el.parentNode.children].forEach(b=>b.classList.remove('on'));
  el.classList.add('on');

function ajouterTache(){
  const titre = document.getElementById('nvTitre').value.trim();
  if(!titre) return;
  const heure = document.getElementById('nvHeure').value || null;
  const k = K();
  if(repChoisie !== 'non'){
    const m = {id:cleUnique(), titre, heure, repetition:repChoisie, debut:k,
               jourSemaine:new Date(k+'T12:00:00').getDay()};
    data.modeles.push(m);
    data.taches.push({id:cleUnique(), titre, jour:k, heure, fait:false, modele:m.id});
  }else{
    data.taches.push({id:cleUnique(), titre, jour:k, heure, fait:false, type:typeChoisi});
  }
  repChoisie = 'non'; typeChoisi = 'aucun';
  sauver(); fermerFeuille(); rendre();
}
function enregistrerTache(i){
  const t = data.taches.find(x=>x.id===i);
  const titre = document.getElementById('nvTitre').value.trim();
  if(!titre) return;
  const etaitFait = t.fait;
  if(etaitFait) reporterSuivi(t, -1);        // on retire l'ancien report
  t.titre = titre;
  t.heure = document.getElementById('nvHeure').value || null;
  t.ordre = undefined;
  t.type = typeChoisi;
  if(etaitFait) reporterSuivi(t, 1);         // et on applique le nouveau
  if(t.modele){
    const m = data.modeles.find(x=>x.id===t.modele);
    if(m && confirm("Appliquer aussi aux jours suivants ?")){ m.titre=t.titre; m.heure=t.heure; }
  }
  sauver(); fermerFeuille(); rendre();
}

/* ---- Journées types ---- */
function fabriquerJournee(j){
  const r = {id:cleUnique(), nom:j.nom, emoji:j.emoji, jours:[], actif:true, depart:j.depart,
             etapes:j.etapes.map(([titre,duree])=>({id:cleUnique(), titre, duree, heure:null}))};
  recalculerHeures(r);
  return r;
}
let rechercheJournee = "";
function chercherJournee(v){ rechercheJournee = v; feuilleJournees(-1, true); }
async function feuilleJournees(indexOuvert, garderRecherche){
  if(!await chargerCatalogue()) return;
  const q = rechercheJournee.trim().toLowerCase();
  const retenues = JOURNEES.map((j,i)=>({j,i})).filter(({j})=> !q ||
    (j.nom+' '+j.resume+' '+j.etapes.map(e=>e[0]).join(' ')).toLowerCase().includes(q));
  document.getElementById('feuille').innerHTML = `
    <h3>Journées types</h3>

      oninput="chercherJournee(this.value)" autocomplete="off">

      const total = j.etapes.reduce((a,e)=>a+e[1],0);

      return `<div class="carte" style="--accent:${teinte(i)}; padding:14px">
        <button class="txt" style="width:100%" onclick="feuilleJournees(${ouvert?-1:i})">

        <p class="vide" style="margin:8px 0 0">${j.resume}</p>
        ${ouvert ? `<div style="margin-top:10px">${apercu.etapes.map(e=>`
          <div class="ligne"><span>${e.heure.replace(':','h')}  ${prot(e.titre)}</span><span>${e.duree} min</span></div>`).join('')}
          <div class="rangee" style="margin-top:12px">

function etiquetteRoutine(idRoutine){
  const r = data.routines.find(x=>x.id===idRoutine);
  return r ? prot(r.emoji+' '+r.nom) : 'routine';

function etiquetteRep(m){
  if(m.repetition==='quotidien') return 'chaque jour';
  if(m.repetition==='ouvres') return 'du lundi au vendredi';
  const j = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][m.jourSemaine];
  return 'chaque '+j;
}
function supprimerModele(i){
  if(!confirm("Arrêter cette répétition ? Les tâches déjà créées restent en place.")) return;
  data.modeles = data.modeles.filter(m=>m.id!==i);
  sauver(); feuilleReglages(); rendre();
}

  document.getElementById('fond').classList.add('on');

}
function fermerFeuille(){
  clearInterval(chrono); chrono = null;
  if(data.enCours) rendre();
  document.getElementById('fond').classList.remove('on');
  document.getElementById('feuille').classList.remove('on');
}

/* ================= Rendu ================= */
function prot(s){
  return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function fmt(n){ return Number(n).toFixed(1).replace('.',','); }

function rendre(){
  const y = window.scrollY;
  document.getElementById('titreJour').textContent = libelle(jour);
  document.getElementById('retourJour').hidden = estAujourdhui(jour);
  document.body.dataset.onglet = onglet;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.onglet===onglet));
  const ecrans = {journee:ecranJournee, routine:ecranRoutine, habitudes:ecranHabitudes,
                  suivi:ecranSuivi, semaine:ecranSemaine, bilan:ecranBilan};
  document.getElementById('ecran').innerHTML = ecrans[onglet]();
  window.scrollTo(0, y);   // on ne repart pas en haut de la liste
}
